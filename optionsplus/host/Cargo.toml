[workspace]
resolver = "2"
members = ["crates/sofle-proto", "crates/sofle-link", "apps/sofctl"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
sofle-proto = { path = "crates/sofle-proto" }
sofle-link = { path = "crates/sofle-link" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
btleplug = "0.13"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
futures = "0.3"
uuid = "1"
hidapi = { version = "2", default-features = false }
