---
# GitHub Actions matrix for every keyboard in this repo.
# Keymaps under config/ are generated by keymap/gen.py (base: config/corne.keymap).
# Left halves are the central: GaggsKey module + ZMK Studio.
#
# Split halves unable to pair -> flash nice_settings_reset to both halves first
# (https://zmk.dev/docs/troubleshooting).
include:
  # ---- Sofle (nice!nano v2 + nice!oled) ----
  - board: nice_nano_v2
    shield: sofle_left nice_oled
    snippet: studio-rpc-usb-uart
    cmake-args: >-
      -DCONFIG_ZMK_KEYBOARD_NAME=\"Sofle_Oled\" -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_SLEEP=y -DCONFIG_ZMK_IDLE_TIMEOUT=60000
      -DZMK_EXTRA_MODULES=${GITHUB_WORKSPACE}/gaggskey/firmware
      -DEXTRA_CONF_FILE=${GITHUB_WORKSPACE}/gaggskey/firmware/gaggskey_central.conf
    artifact-name: nice_sofle_left_oled_gaggskey
  - board: nice_nano_v2
    shield: sofle_right nice_oled
    cmake-args: -DCONFIG_ZMK_SLEEP=y -DCONFIG_ZMK_IDLE_TIMEOUT=60000
    artifact-name: nice_sofle_right_oled

  # ---- Corne (wireless, nice!nano v2) ----
  - board: nice_nano_v2
    shield: corne_left
    snippet: studio-rpc-usb-uart
    cmake-args: >-
      -DZMK_EXTRA_MODULES=${GITHUB_WORKSPACE}/gaggskey/firmware
      -DEXTRA_CONF_FILE=${GITHUB_WORKSPACE}/gaggskey/firmware/gaggskey_central.conf
    artifact-name: corne_left_gaggskey
  - board: nice_nano_v2
    shield: corne_right
    artifact-name: corne_right

  # ---- Kyria (custom shield: config/boards/shields/gaggs_kyria) ----
  - board: nice_nano_v2
    shield: gaggs_kyria_left
    snippet: studio-rpc-usb-uart
    cmake-args: >-
      -DCONFIG_ZMK_STUDIO=y
      -DZMK_EXTRA_MODULES=${GITHUB_WORKSPACE}/gaggskey/firmware
      -DEXTRA_CONF_FILE=${GITHUB_WORKSPACE}/gaggskey/firmware/gaggskey_central.conf
    artifact-name: gaggs_kyria_left_gaggskey
  - board: nice_nano_v2
    shield: gaggs_kyria_right
    artifact-name: gaggs_kyria_right

  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: nice_settings_reset
